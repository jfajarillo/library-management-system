<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>📚 Library Management System</h1>
    <nav>
      <button class="tab active" data-tab="books">Books</button>
      <button class="tab" data-tab="members">Members</button>
      <button class="tab" data-tab="loans">Loans</button>
    </nav>
  </header>

  <div id="message" class="message hidden"></div>

  <main>
    <!-- BOOKS -->
    <section id="books" class="panel">
      <div class="card">
        <h2 id="book-form-title">Add Book</h2>
        <form id="book-form">
          <input type="hidden" name="editId">
          <input name="title" placeholder="Title *">
          <input name="author" placeholder="Author *">
          <input name="isbn" placeholder="ISBN (10 or 13 digits)">
          <input name="totalCopies" type="number" min="1" value="1" placeholder="Copies">
          <button type="submit">Save</button>
          <button type="button" id="book-cancel" class="secondary hidden">Cancel</button>
        </form>
      </div>
      <div class="card">
        <div class="toolbar">
          <h2>Books</h2>
          <input id="book-search" placeholder="Search title or author…">
        </div>
        <table>
          <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>ISBN</th><th>Available</th><th></th></tr></thead>
          <tbody id="book-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- MEMBERS -->
    <section id="members" class="panel hidden">
      <div class="card">
        <h2 id="member-form-title">Register Member</h2>
        <form id="member-form">
          <input type="hidden" name="editId">
          <input name="name" placeholder="Full name *">
          <input name="email" placeholder="Email *">
          <button type="submit">Save</button>
          <button type="button" id="member-cancel" class="secondary hidden">Cancel</button>
        </form>
      </div>
      <div class="card">
        <h2>Members</h2>
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th></th></tr></thead>
          <tbody id="member-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- LOANS -->
    <section id="loans" class="panel hidden">
      <div class="card">
        <h2>Borrow a Book</h2>
        <form id="loan-form">
          <select name="memberId" id="loan-member"></select>
          <select name="bookId" id="loan-book"></select>
          <button type="submit">Borrow</button>
        </form>
        <p class="hint">Loan period: 14 days · Max 3 books per member · Late fine: ₱10/day (max ₱500)</p>
      </div>
      <div class="card">
        <div class="toolbar">
          <h2>Loans</h2>
          <select id="loan-filter">
            <option value="">All</option>
            <option value="active">Not returned</option>
            <option value="overdue">Overdue</option>
            <option value="returned">Returned</option>
          </select>
        </div>
        <table>
          <thead><tr><th>ID</th><th>Member</th><th>Book</th><th>Borrowed</th><th>Due</th><th>Status</th><th>Fine</th><th></th></tr></thead>
          <tbody id="loan-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
